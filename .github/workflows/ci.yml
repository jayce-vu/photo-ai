name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU only, no model downloads)
        run: |
          python -m pip install -U pip
          pip install -e '.[local,test]'
      - name: Lint
        run: ruff check .
      - name: Notebook is up to date with generator
        run: |
          python scripts/build_notebook.py
          git diff --exit-code colab/
      - name: Unit tests (GPU / real-ARW tests skipped)
        run: pytest -q -m "not gpu and not integration"

  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with CPU torch
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[local,test]'
      - name: Architecture tests (no checkpoint download)
        run: pytest -q -m "not gpu and not integration" tests/test_denoise.py

  secrets-and-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed photos, weights or secrets
        run: |
          bad=$(git ls-files | grep -Ei '\.(arw|dng|nef|cr2|cr3|tif|tiff|pth|pt|ckpt|safetensors|onnx|tflite)$|(^|/)\.env' || true)
          if [ -n "$bad" ]; then echo "Forbidden files committed:"; echo "$bad"; exit 1; fi
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!tests/test_notebook.py'; then
            echo "Possible secret committed"; exit 1; fi
